<style>
:root {
  /* Palette — DESIGN §3.1 */
  --paper:#F5F3F7;
  --surface:#FCFBFD;
  --white:#FFFFFF;
  --edge:#E6E3EB;
  --hair:#DCD9E0;
  --ink:#2A2537;
  --ink-2:#6B5E82;
  --a:#625492;
  --b:#61829E;
  --better:#74936C;
  --worse:#B15D59;
  --a-wash:rgba(98,84,146,.10);
  --b-wash:rgba(97,130,158,.12);
  --tint:rgba(42,37,55,.045);

  /* Smoked vellum — DESIGN §3.3. An ink tint, not a white one, so the plate
     still holds an edge over blank paper; the inset line is the cut edge. */
  --glass:rgba(47,41,61,.035);
  --glass-filter:blur(14px) saturate(1.2) brightness(1.07);
  --glass-drop:0 10px 28px rgba(42,37,55,.13), 0 1px 2px rgba(42,37,55,.06), inset 0 1px 0 rgba(255,255,255,.65);
  --lift:0 8px 22px rgba(42,37,55,.10), 0 1px 2px rgba(42,37,55,.06);

  --serif:'Libre Bodoni', Georgia, 'Times New Roman', serif;
  --sans:'Red Hat Text', 'Segoe UI', system-ui, sans-serif;

  /* One easing curve everywhere — DESIGN §12. */
  --ease:cubic-bezier(.16,1,.3,1);
  --d-fast:.16s; --d-state:.3s; --d-flow:.65s;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px; --s8:56px;
}

* { box-sizing:border-box; }
h1, h2, h3, p { margin:0; font-weight:400; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input { font:inherit; color:inherit; }

html, body {
  margin:0; height:100%; overflow:hidden;
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-weight:400; font-size:16px;
  font-variant-numeric:lining-nums tabular-nums;
  -webkit-font-smoothing:antialiased;
  caret-color:var(--a);
}
/* Libre Bodoni keeps its own proportional numerals and its ligatures; it is never tracked. */
.serif, .serif * {
  font-family:var(--serif); font-weight:400; letter-spacing:0;
  font-variant-numeric:lining-nums proportional-nums;
  font-variant-ligatures:common-ligatures contextual;
}
.caps { text-transform:uppercase; letter-spacing:.075em; font-weight:500; }

::selection { background:rgba(98,84,146,.22); }
:focus { outline:none; }
:focus-visible { outline:1.5px solid var(--a); outline-offset:3px; border-radius:6px; }

/* ── Stage: one fixed 1920 × 1050 canvas, scaled to fit, never reflowed ─────── */
#stage-wrap { position:fixed; inset:0; overflow:hidden; background:var(--paper); }
#stage {
  position:absolute; top:0; left:0; width:1920px; height:1050px;
  padding:30px 56px 34px;
  display:grid; grid-template-rows:64px 1fr; row-gap:22px;
  transform-origin:0 0;
}

/* ── Top bar ───────────────────────────────────────────────────────────────── */
.topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--hair); padding-bottom:20px; }
.brand { display:flex; align-items:baseline; gap:18px; }
.title { font-size:35px; line-height:1; }
.brand-rule { width:1px; height:24px; background:var(--hair); align-self:center; }
.subtitle { font-size:18px; font-weight:300; color:var(--ink-2); letter-spacing:.01em; }
.top-right { display:flex; align-items:center; gap:28px; }

.modes { position:relative; display:grid; grid-template-columns:150px 150px; padding:4px; border-radius:999px; background:var(--tint); }
.modes-thumb {
  position:absolute; top:4px; left:4px; width:150px; height:calc(100% - 8px);
  border-radius:999px; background:var(--surface); border:1px solid var(--edge); box-shadow:var(--lift);
  transition:transform .5s var(--ease);
}
.modes[data-mode="cmp"] .modes-thumb { transform:translateX(150px); }
.mode-btn { position:relative; height:42px; border-radius:999px; font-size:20px; color:var(--ink-2); transition:color var(--d-state) var(--ease); }
.mode-btn[aria-pressed="true"] { color:var(--ink); }
.mode-btn:hover { color:var(--ink); }

.badge { display:flex; align-items:center; gap:10px; height:42px; padding:0 4px; font-size:16px; color:var(--ink-2); cursor:default; }
.badge b { font-weight:500; color:var(--ink); }
.badge:hover { color:var(--ink); }

/* ── Work area ─────────────────────────────────────────────────────────────── */
.work { display:grid; grid-template-columns:348px minmax(0,1fr); min-height:0; }

/* Library */
.lib { display:flex; flex-direction:column; min-height:0; padding-right:44px; border-right:1px solid var(--hair); }
.lib-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:var(--s4); }
.lib-head h2 { font-size:27px; line-height:1; }
.lib-count { font-size:15.5px; color:var(--ink-2); }

.search { display:flex; align-items:center; gap:10px; height:46px; padding:0 2px; border-bottom:1px solid var(--hair); transition:border-color var(--d-state) var(--ease); }
.search:focus-within { border-bottom-color:var(--ink); }
.search input { flex:1; min-width:0; border:0; background:none; font-size:17px; font-weight:400; padding:0; }
.search input::placeholder { color:var(--ink-2); font-weight:300; }

.drop {
  position:relative; margin:var(--s5) 0 var(--s4); padding:18px 20px 16px; border-radius:12px;
  border:1px dashed rgba(98,84,146,.45); background:transparent; text-align:left; width:100%;
  transition:background var(--d-state) var(--ease), border-color var(--d-state) var(--ease);
  overflow:hidden;
}
.drop:hover, body.dragging .drop { background:var(--a-wash); border-color:var(--a); }
.drop-title { display:flex; align-items:center; gap:10px; font-size:21px; line-height:1.15; }
.drop-sub { margin-top:6px; font-size:15px; color:var(--ink-2); }
.drop-sub u { text-decoration:underline; text-decoration-color:rgba(98,84,146,.45); text-underline-offset:3px; color:var(--a); }
.drop-run { display:none; }
.drop.running .drop-idle { display:none; }
.drop.running .drop-run { display:block; }
.drop-file { font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drop-count { display:flex; align-items:baseline; gap:8px; margin-top:6px; color:var(--ink-2); font-size:15px; }
.drop-count .serif { font-size:30px; line-height:1; color:var(--ink); min-width:1.3em; }
.drop-rule { position:absolute; left:0; bottom:0; height:2px; width:100%; background:var(--a); transform-origin:0 50%; transform:scaleX(0); }

.lib-list { flex:1; min-height:0; overflow-y:auto; margin:0 -10px; padding:0 10px 28px; scrollbar-width:thin; scrollbar-color:var(--hair) transparent;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 36px), transparent); mask-image:linear-gradient(#000 calc(100% - 36px), transparent); }

.group { margin-top:var(--s3); }

.row {
  position:relative; display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  min-height:38px; padding:7px 10px; margin:0 -10px; width:calc(100% + 20px); border-radius:8px;
  font-size:16px; line-height:1.3; transition:background var(--d-fast) var(--ease);

.tmpl { display:flex; align-items:center; gap:10px; margin-top:var(--s3); padding:12px 0 0; border-top:1px solid var(--hair); font-size:15px; color:var(--ink-2); transition:color var(--d-fast) var(--ease); }

/* Main column */
.main { display:grid; grid-template-rows:84px 1fr; row-gap:20px; min-height:0; min-width:0; padding-left:52px; }

/* ── Sentence — DESIGN §7 ─────────────────────────────────────────────────── */
.sentence-wrap { position:relative; display:flex; align-items:center; border-bottom:1px solid var(--hair); padding-bottom:16px; }
.sentence { display:flex; align-items:center; gap:14px; flex-wrap:nowrap; min-width:0; }
.word { font-family:var(--serif); font-style:italic; font-size:32px; line-height:1; color:var(--ink); white-space:nowrap; }
.word.in { animation:wordin .55s var(--ease) both; }
.sentence.tight { gap:10px; }
.sentence.tight .word { font-size:29px; }
.sentence.tight .pill-main { font-size:16px; gap:8px; padding:0 10px 0 13px; }
.sentence.tight .pill-tool { width:27px; height:27px; }
.sentence.tight .pill-cap { font-size:16px; padding-right:8px; }
@keyframes wordin { from { clip-path:inset(-40% 100% -45% -8%); opacity:.2; } to { clip-path:inset(-40% -8% -45% -8%); opacity:1; } }

.pill {
  position:relative; display:inline-flex; align-items:center; height:48px; border-radius:999px;
  border:1px solid var(--edge); background:var(--surface); white-space:nowrap; isolation:isolate;
  transition:border-color var(--d-state) var(--ease), background var(--d-state) var(--ease), box-shadow var(--d-state) var(--ease);
}
.pill-main { display:inline-flex; align-items:center; gap:10px; height:100%; padding:0 14px 0 16px; border-radius:999px; font-size:17px; font-weight:500; }
.pill-main:hover { background:rgba(255,255,255,.55); }
.pill-cap { font-family:var(--serif); font-style:italic; font-weight:400; font-size:17px; color:var(--ink-2); padding-right:10px; margin-right:2px; border-right:1px solid var(--hair); line-height:24px; }
.pill .chev { flex:none; opacity:.6; }
.pill-tools { display:inline-flex; align-items:center; gap:2px; padding-right:7px; margin-left:-4px; }
.pill-tool { display:grid; place-items:center; width:30px; height:30px; border-radius:50%; color:var(--ink-2); transition:background var(--d-fast) var(--ease), color var(--d-fast) var(--ease); }
.pill-tool:hover { background:rgba(42,37,55,.07); color:var(--ink); }

.pill.s-a { background:linear-gradient(var(--a-wash), var(--a-wash)), var(--surface); border-color:rgba(98,84,146,.42); }
.pill.s-b { background:linear-gradient(var(--b-wash), var(--b-wash)), var(--surface); border-color:rgba(97,130,158,.48); }
.pill.s-base { background:var(--white); border-color:var(--ink); box-shadow:0 1px 0 rgba(42,37,55,.04); }

.pill.empty { border:1px dashed rgba(42,37,55,.32); background:transparent; }
.pill.empty .pill-main { font-weight:400; color:var(--ink-2); }
.pill.empty:hover { border-color:var(--ink); }
.pill.empty.breathe { border-color:var(--ink); animation:breathe 1.5s var(--ease) infinite alternate; }
@keyframes breathe {
  from { box-shadow:0 0 0 0 rgba(98,84,146,0); background:rgba(255,255,255,.2); }
  to { box-shadow:0 0 0 7px rgba(98,84,146,.09); background:rgba(255,255,255,.9); }
}

/* Ink-drop: a newly filled pill floods from its glyph outward. */
.pill.inked::after {
  content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:-1; pointer-events:none;
  background:var(--drop, var(--a)); opacity:.28;
  animation:inkdrop .9s var(--ease) forwards;
}
@keyframes inkdrop {
  0% { clip-path:circle(0 at 26px 50%); opacity:.38; }
  60% { clip-path:circle(120% at 26px 50%); opacity:.22; }
  100% { clip-path:circle(120% at 26px 50%); opacity:0; }
}
.pill.nudge { animation:nudge .42s var(--ease); }
@keyframes nudge { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-5px); } 55% { transform:translateX(4px); } 80% { transform:translateX(-2px); } }

.time { height:48px; padding:0 20px; border-radius:999px; font-size:18px; font-weight:500; border:1px dashed rgba(42,37,55,.32); color:var(--ink-2); display:inline-flex; align-items:center; gap:10px;
  transition:background var(--d-state) var(--ease), border-color var(--d-state) var(--ease), color var(--d-state) var(--ease); }
.time:hover { border-color:var(--ink); color:var(--ink); }
.time.on { border-style:solid; color:var(--ink); }
.time.s-base { background:var(--white); border-color:var(--ink); }
.time.s-a { background:linear-gradient(var(--a-wash), var(--a-wash)), var(--surface); border-color:rgba(98,84,146,.42); }
.time.s-b { background:linear-gradient(var(--b-wash), var(--b-wash)), var(--surface); border-color:rgba(97,130,158,.48); }
.time .time-cap { font-family:var(--serif); font-style:italic; font-weight:400; font-size:16px; color:var(--ink-2); }

.hint { position:absolute; z-index:20; left:0; top:calc(100% + 10px); padding:9px 14px; border-radius:10px; font-size:15.5px; color:var(--ink);
  background:var(--glass); box-shadow:var(--glass-drop); -webkit-backdrop-filter:var(--glass-filter); backdrop-filter:var(--glass-filter);
  opacity:0; transform:translateY(-4px); transition:opacity var(--d-state) var(--ease), transform var(--d-state) var(--ease); pointer-events:none; }
.hint.on { opacity:1; transform:none; }

/* ── Content: chart + findings ─────────────────────────────────────────────── */
.content { display:grid; grid-template-columns:minmax(0,1.42fr) minmax(0,1fr); min-height:0; }
.chart-col { position:relative; display:flex; flex-direction:column; min-height:0; min-width:0; padding-right:48px; border-right:1px solid var(--hair); }
.chart-bar { display:flex; align-items:center; justify-content:space-between; height:40px; margin-bottom:6px; }
.chart-cap { font-size:15px; color:var(--ink-2); }
.chart-cap b { font-weight:500; color:var(--ink); }
.chart-tools { display:flex; align-items:center; gap:6px; }
.tool { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:999px; font-size:15px; color:var(--ink-2); transition:background var(--d-fast) var(--ease), color var(--d-fast) var(--ease); }
.tool:hover { background:var(--tint); color:var(--ink); }
.tool[disabled] { opacity:.4; pointer-events:none; }
.switch { width:34px; height:20px; border-radius:999px; background:rgba(42,37,55,.14); position:relative; transition:background var(--d-state) var(--ease); }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(42,37,55,.25); transition:transform var(--d-state) var(--ease); }
.tool[aria-pressed="true"] .switch { background:var(--a); }
.tool[aria-pressed="true"] .switch::after { transform:translateX(14px); }
.tool[aria-pressed="true"] { color:var(--ink); }
.tool-sep { width:1px; height:20px; background:var(--hair); margin:0 4px; }

#chart { display:block; flex:none; overflow:visible; }
#chart .hit { cursor:pointer; }

.tool { white-space:nowrap; }
.tool[hidden] { display:none; }
.ph-tag { display:inline-block; margin-left:6px; font-size:13.5px; font-weight:500; color:var(--ink-2); border:1px dashed rgba(107,94,130,.55); border-radius:999px; padding:0 7px; vertical-align:2px; }

/* Findings — DESIGN §9 */
.find { display:flex; flex-direction:column; min-height:0; min-width:0; padding-left:52px; }
/* Verdict and findings sit at the top; the library strips below take up whatever height is left. */
.find-top { flex:none; display:flex; flex-direction:column; }
.verdict { font-family:var(--serif); font-size:21px; line-height:1.45; color:var(--ink); text-wrap:pretty; }
.verdict.prompt { font-style:italic; color:var(--ink-2); font-size:21px; }
.verdict em { font-style:normal; text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:5px; }
.verdict em.up { text-decoration-color:rgba(116,147,108,.75); }
.verdict em.down { text-decoration-color:rgba(177,93,89,.7); }
.verdict.in { animation:fadeup .6s var(--ease) both; }
@keyframes fadeup { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

.tally { margin-top:24px; border-top:1px solid var(--hair); }
.tally:empty { border-top:0; }
.tally-row { display:flex; align-items:center; gap:12px; min-height:48px; padding:7px 0; border-bottom:1px solid var(--hair); }
.tally-who { display:flex; align-items:center; gap:10px; flex:1; min-width:0; font-size:15px; line-height:1.3; color:var(--ink-2); }
.tally-who .glyph { flex:none; }
.tally-n { display:flex; align-items:baseline; gap:5px; font-size:14px; color:var(--ink-2); }
.tally-n .serif { font-size:24px; line-height:1; color:var(--ink); }
.tally-n + .tally-n { margin-left:14px; }

.lists { display:grid; grid-template-columns:1fr 1fr; column-gap:24px; margin-top:22px; }
.list-head { display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:18px; padding-bottom:6px; }
.item {
  display:grid; grid-template-columns:22px 1fr auto; align-items:center; column-gap:8px; width:100%;
  min-height:31px; padding:4px 8px; margin:0 -8px; width:calc(100% + 16px); border-radius:7px; text-align:left;
  transition:background var(--d-fast) var(--ease);
}
.item:hover, .item.lit { background:var(--tint); }
.item-attr { font-size:14px; letter-spacing:.04em; line-height:1.25; color:var(--ink-2); }
.item-attr i { font-style:normal; font-weight:400; letter-spacing:0; color:var(--ink-2); margin-left:6px; text-transform:none; font-size:14px; white-space:nowrap; }
.item-d { font-size:15px; font-weight:500; }
.more { font-size:15px; color:var(--ink-2); padding:6px 0 0; }
.none { font-size:15px; font-style:italic; color:var(--ink-2); padding:6px 0; }

.pos { margin-top:28px; padding-top:16px; border-top:1px solid var(--hair); }
.pos-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.pos-head h3 { font-size:22px; }
.mini-seg { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--tint); }
.mini-seg button { height:30px; padding:0 13px; border-radius:999px; font-size:15px; color:var(--ink-2); border:1px solid transparent; transition:color var(--d-fast) var(--ease), background var(--d-fast) var(--ease); }
.mini-seg button:hover { color:var(--ink); }
.mini-seg button[aria-pressed="true"] { background:var(--surface); border-color:var(--edge); color:var(--ink); }
#strips { display:block; overflow:visible; }

/* ── Floating things ───────────────────────────────────────────────────────── */
.vellum {
  position:absolute; z-index:30; pointer-events:none;
  background:var(--glass); border-radius:12px; box-shadow:var(--glass-drop);
  -webkit-backdrop-filter:var(--glass-filter); backdrop-filter:var(--glass-filter);
  opacity:0; visibility:hidden; transform:translateY(4px);
  transition:opacity .18s var(--ease), transform .18s var(--ease), visibility 0s linear .18s;
}
.vellum.on { opacity:1; visibility:visible; transform:none; transition-delay:0s; }

#tip { min-width:260px; max-width:440px; padding:14px 18px 15px; }
.tip-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.tip-attr { font-size:14.5px; }
.tip-time { font-size:15px; color:var(--ink-2); }
.tip-rows { display:grid; grid-template-columns:24px 1fr auto auto; column-gap:10px; row-gap:6px; align-items:center; font-size:15.5px; }
.tip-rows .v { text-align:right; font-weight:500; }
.tip-rows .d { text-align:right; color:var(--ink-2); min-width:3.2em; }
.tip-rows .who { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:280px; }
.tip-rows .who.em { font-weight:500; }
.tip-verdict { display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(42,37,55,.12); font-family:var(--serif); font-size:18px; }
.tip-verdict small { font-family:var(--sans); font-size:14.5px; color:var(--ink-2); }
.tip-title { font-size:20px; line-height:1.2; margin-bottom:4px; }
.tip-sub { font-size:14.5px; color:var(--ink-2); }
.tip-rank { display:grid; grid-template-columns:24px 1fr auto; column-gap:10px; row-gap:6px; align-items:center; font-size:15.5px; margin-top:8px; }
.tip-rank .r { font-family:var(--serif); font-size:20px; text-align:right; }
.tip-rank .r small { font-family:var(--sans); font-size:13.5px; color:var(--ink-2); margin-left:3px; }

#model-card { width:380px; padding:20px 22px 18px; }
.mc-title { font-size:23px; }
.mc-big { display:flex; align-items:baseline; gap:12px; margin:12px 0 6px; }
.mc-big .serif { font-size:46px; line-height:1; }
.mc-big span:last-child { font-size:15px; color:var(--ink-2); }
.mc-text { font-size:15px; line-height:1.5; color:var(--ink); }
.mc-grid { display:grid; grid-template-columns:auto 1fr; column-gap:16px; row-gap:7px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(42,37,55,.12); font-size:15px; }
.mc-grid dt { color:var(--ink-2); }
.mc-grid dd { margin:0; }
.mc-foot { margin-top:12px; font-size:13.5px; font-style:italic; color:var(--ink-2); }

.menu {
  position:absolute; z-index:40; width:380px; padding:10px 8px 8px; border-radius:14px;
  background:var(--surface); border:1px solid var(--edge); box-shadow:0 10px 22px rgba(42,37,55,.12), 0 1px 3px rgba(42,37,55,.06);
  opacity:0; visibility:hidden; transform:translateY(-6px) scale(.985); transform-origin:top left;
  transition:opacity .2s var(--ease), transform .2s var(--ease), visibility 0s linear .2s;
}
.menu.on { opacity:1; visibility:visible; transform:none; transition-delay:0s; }
.menu .search { margin:0 10px 6px; height:42px; }
.menu-list { max-height:420px; overflow-y:auto; padding:0 10px; scrollbar-width:thin; scrollbar-color:var(--hair) transparent; }
.menu .group-head h3 { font-size:17px; }
.menu .row.cur { background:var(--tint); }
.menu .row-id { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.menu .row .in-slot { flex:none; font-size:13px; font-style:italic; color:var(--ink-2); }

.toast { position:absolute; z-index:50; right:0; top:44px; padding:10px 14px; font-size:15px; max-width:340px; pointer-events:none; }

.drag-frame { position:absolute; inset:12px; border:1.5px dashed rgba(98,84,146,.55); border-radius:18px; pointer-events:none; opacity:0; transition:opacity var(--d-state) var(--ease); z-index:60; }
body.dragging .drag-frame { opacity:1; }

/* ── Arrival: the regions come in composed — DESIGN §12 ─────────────────────── */
.arrive { opacity:0; transform:translateY(10px); }
.stage-in .arrive { opacity:1; transform:none; transition:opacity .7s var(--ease), transform .7s var(--ease); }
.stage-in .arrive.d1 { transition-delay:.06s; }
.stage-in .arrive.d2 { transition-delay:.14s; }
.stage-in .arrive.d3 { transition-delay:.22s; }
.stage-in .arrive.d4 { transition-delay:.30s; }

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation:none !important; transition-duration:.01ms !important; transition-delay:0s !important; }
  .arrive { opacity:1; transform:none; }
}
</style>

<div id="stage-wrap"><div id="stage">

  </header>

  <div class="work">

        <input id="lib-search" type="text" placeholder="Search formulas" aria-label="Search formulas" autocomplete="off" spellcheck="false">

        </div>

        </div>

      </button>

        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.8 7.6L8 10.8l3.2-3.2M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download readings template (.csv)
      </button>
    </aside>

    <section class="main">

        <div class="hint" id="hint"></div>

      <div class="content">

            <div class="chart-cap" id="chart-cap"></div>
            <div class="chart-tools">
              <button class="tool" id="sig-only" aria-pressed="false" type="button"><span class="switch" aria-hidden="true"></span>Sig only</button>
              <span class="tool-sep" aria-hidden="true"></span>
              <button class="tool" id="export-png" type="button">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.8 7.6L8 10.8l3.2-3.2M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Export PNG

}

/* Bring the drawn series in line with state. Returns true when this update is

  TIMES.forEach(function (t) { f.scores[t].forEach(function (v, a) { lines.push('"' + f.id + '",' + t + ',"' + ATTR[a] + '",' + f1(v)); }); });
  download(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/csv" }), slug(f.id) + "_AI-readings.csv");
  toast("Saved " + slug(f.id) + "_AI-readings.csv");
}
$("tmpl").addEventListener("click", function () {
  var lines = ["formula_id,attribute,T0,T3,T6"];
  ATTR.forEach(function (a) { lines.push(',"' + a + '",,,'); });
  download(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/csv" }), "AI-readings_template.csv");
});

function finishAnims() {
  for (var k in anims) { var a = anims[k]; delete anims[k]; a.fn(1); if (a.done) a.done(); }
  paintChart();
}
function fontCSS() {
  var css = "";
  [].forEach.call(document.querySelectorAll("style"), function (s) { if (s.textContent.indexOf("@font-face") !== -1) css += s.textContent; });
  return css;
}
function exportSVG() {
  finishAnims();
  var L = CH.L, list = seriesList(), pad = 48;
  var clone = CH.svg.cloneNode(true);
  [].forEach.call(clone.querySelectorAll("g"), function (g, i) { if (g.querySelector(".hit")) g.remove(); });
  var kids = clone.children;
  /* Drop the interactive layers (hint, pulse, link, bands) from the copy. */
  [CH.gHint, CH.gPulse, CH.gLink, CH.gBands].forEach(function (g) {
    var idx = [].indexOf.call(CH.svg.children, g);
    if (idx >= 0 && kids[idx]) kids[idx].setAttribute("display", "none");
  });
  var W = L.W + pad * 2, head = 132, foot = 54, H = pad + head + L.H + foot;
  var parts = [];
  function word(t) { return '<tspan font-family="' + SERIF + '" font-style="italic" font-size="27" fill="' + C.ink + '">' + esc(t) + " </tspan>"; }
  function id(t) { return '<tspan font-family="' + SANS + '" font-weight="500" font-size="22" fill="' + C.ink + '">' + esc(t) + " </tspan>"; }
  var l1, l2;
  if (S.mode === "cmp") {
    var c = S.cmp;
    l1 = word("Compare") + (c.a ? id(c.a) : "") + (c.b ? word("and") + id(c.b) : "");
    l2 = word("against") + (c.bench ? id(c.bench) + word("(bench)") : word("…"));
  } else {
    l1 = word("Track") + id(S.dyn.f);
    l2 = word("over") + id(dynTimes().map(function (t) { return TIMES[t]; }).join(" · "));
  }
  parts.push('<text x="' + pad + '" y="' + (pad + 26) + '">' + l1 + "</text>");
  parts.push('<text x="' + pad + '" y="' + (pad + 62) + '">' + l2 + "</text>");
  var lx = pad, ly = pad + 100, extra = 0, meas = document.createElement("canvas").getContext("2d");
  meas.font = "400 15px " + SANS;
  list.forEach(function (s) {
    var st = ROLE[s.role], label = S.mode === "cmp" ? (s.role === "base" ? "Bench · " + s.f.id : s.f.id) : TIMES[s.t] + (s.role === "base" ? " · baseline" : "");
    var span = 32 + meas.measureText(label).width;
    if (lx > pad && lx + span > W - pad) { lx = pad; ly += 26; extra += 26; }
    parts.push('<g transform="translate(' + lx + "," + (ly - 5) + ')"><path d="M0 0H24" stroke="' + st.color + '" stroke-width="' + st.w + '"' + (st.dash ? ' stroke-dasharray="4 3"' : "") + '/><circle cx="12" cy="0" r="3.8" fill="' + (st.hollow ? "#fff" : st.color) + '" stroke="' + (st.hollow ? st.color : C.paper) + '" stroke-width="1.4"/></g>');
    parts.push('<text x="' + (lx + 32) + '" y="' + ly + '" font-family="' + SANS + '" font-size="15" fill="' + C.ink + '">' + esc(label) + "</text>");
    lx += span + 28;
  });
  head += extra; H += extra;
  parts.push('<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + (pad + head - 14) + '" y2="' + (pad + head - 14) + '" stroke="' + C.hair + '"/>');
  var inner = new XMLSerializer().serializeToString(clone).replace(/^<svg[^>]*>/, "").replace(/<\/svg>$/, "");
  parts.push('<g transform="translate(' + pad + "," + (pad + head) + ')">' + inner + "</g>");
  var fy = H - pad + 14;
  parts.push('<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + (fy - 22) + '" y2="' + (fy - 22) + '" stroke="' + C.hair + '"/>');
  parts.push('<text x="' + pad + '" y="' + fy + '" font-family="' + SERIF + '" font-size="15" fill="' + C.ink + '">Foundation Affinity × AI-lization</text>');
  parts.push('<text x="' + (W - pad) + '" y="' + fy + '" text-anchor="end" font-family="' + SANS + '" font-size="13.5" fill="' + C.ink2 + '">AI readings, DINOv2 · mock data · ' + todayLabel() + "</text>");
  return { w: W, h: H, svg: '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '">' +
    "<style>" + fontCSS() + "</style>" + '<rect width="100%" height="100%" fill="' + C.paper + '"/>' + parts.join("") + "</svg>" };
}
function renderPNG() {
  return new Promise(function (resolve, reject) {
    var x = exportSVG(), k = 2.5;
    var url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(x.svg);
    var img = new Image();
    img.onload = function () {
      setTimeout(function () {
        var cv = document.createElement("canvas");
        cv.width = Math.round(x.w * k); cv.height = Math.round(x.h * k);
        var ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        try { cv.toBlob(function (b) { b ? resolve(b) : reject(new Error("empty")); }, "image/png"); } catch (e) { reject(e); }
      }, 60);
    };
    img.onerror = reject;
    img.src = url;
  });
}
function pngName() {
  return S.mode === "cmp"
    ? "affinity_compare_" + slug(shortId(S.cmp.a || S.cmp.bench || "chart")) + (S.cmp.bench && S.cmp.a ? "_vs_" + slug(shortId(S.cmp.bench)) : "") + ".png"
    : "affinity_dynamic_" + slug(shortId(S.dyn.f || "chart")) + ".png";
}
function exportPNG(copy) {
  if (!seriesList().length) return;
  var name = pngName();
  if (copy && navigator.clipboard && window.ClipboardItem) {
    var item;
    try { item = new ClipboardItem({ "image/png": renderPNG() }); } catch (e) { item = null; }
    if (item) {
      navigator.clipboard.write([item]).then(function () { toast("Copied — paste it straight into a slide."); })
        .catch(function () { renderPNG().then(function (b) { download(b, name); toast("The clipboard is blocked here, so the image was saved as " + name + "."); }); });
      return;
    }
  }
  renderPNG().then(function (b) {
    download(b, name);
    toast(copy ? "The clipboard is blocked here, so the image was saved as " + name + "." : "Saved " + name);
  }).catch(function () { toast("The image could not be rendered in this browser."); });
}
$("export-png").addEventListener("click", function () { exportPNG(false); });
$("copy-png").addEventListener("click", function () { exportPNG(true); });
$("export-csv").addEventListener("click", function () { if (S.dyn.f) exportCSV(BY[S.dyn.f]); });

/* ── Controls ─────────────────────────────────────────────────────────────── */
[].forEach.call(document.querySelectorAll(".mode-btn"), function (b) {
  b.addEventListener("click", function () { setMode(b.dataset.mode); });
});
$("sig-only").addEventListener("click", function () { S.sigOnly = !S.sigOnly; commit(); });
$("lib-search").addEventListener("input", function (e) { S.query = e.target.value; renderLibrary(); });

function reset() {
  cancel("");
  closeMenu(); hideTip();
  S = freshState();
  $("lib-search").value = "";
  importing = false;
  $("drop").classList.remove("running");
  $("drop-rule").style.transform = "scaleX(0)";
  CH.hadPair = false;
  commit({ rebuild: true, modeChange: true });
}

/* Presenter shortcuts — DESIGN §13. No visible UI. */
document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  var k = e.key.toLowerCase();
  if (k === "r") reset();
  else if (k === "1") setMode("dyn");
  else if (k === "2") setMode("cmp");
  else if (k === "s") { S.sigOnly = !S.sigOnly; commit(); }
  else if (k === "escape") { closeMenu(); hideTip(); }
});

/* ── Render wiring ────────────────────────────────────────────────────────── */
renderers.push(function (opts) {
  closeMenu(); hideTip(); HL = null; PREVIEW = null;
  stage.classList.toggle("mode-dyn", S.mode === "dyn");
  var modes = $("modes");
  modes.dataset.mode = S.mode;
  [].forEach.call(modes.querySelectorAll(".mode-btn"), function (b) { b.setAttribute("aria-pressed", b.dataset.mode === S.mode ? "true" : "false"); });
  $("sig-only").setAttribute("aria-pressed", S.sigOnly ? "true" : "false");
  if (opts.rebuild) CH.built = null;
  var climax = syncChart(opts);
  renderSentence(opts);
  renderLibrary();
  renderFindings({ climax: climax });
  renderStrips();
  renderCaption();
});

function fit() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1050);
  VIEW.scale = s;
  stage.style.transform = "translate(" + ((window.innerWidth - 1920 * s) / 2) + "px," + ((window.innerHeight - 1050 * s) / 2) + "px) scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();
commit({ rebuild: true });
requestAnimationFrame(function () { document.body.classList.add("stage-in"); });

})();
</script>
</body>
