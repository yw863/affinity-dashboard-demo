<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colour specimen — series and sig</title>
<style>
body{margin:0;background:#F5F3F7;font:14px/1.4 system-ui,sans-serif;color:#2A2634;padding:40px}
.row{display:flex;gap:40px;flex-wrap:wrap}
figure{margin:0}
figcaption{font-size:12px;color:#6E6878;margin-top:8px}
.sw{display:flex;gap:16px;margin-bottom:24px}
.sw div{width:120px;height:56px;border-radius:6px;color:#fff;font-size:12px;padding:6px;box-sizing:border-box}
</style></head><body>
<div class="sw">
<div style="background:#2A2634">Ink · baseline</div>
<div style="background:#625492">A · #625492</div>
<div style="background:#61829E">B · #61829E</div>
<div style="background:#74936C">Better · #74936C</div>
<div style="background:#B15D59">Worse · #B15D59</div>
</div>
<div class="row" id="row"></div>
<script>
const SIMS={normal:null,deuteranopia:"0.367 0.861 -0.228 0 0 0.280 0.673 0.047 0 0 -0.012 0.043 0.969 0 0 0 0 0 1 0",protanopia:"0.152 1.053 -0.205 0 0 0.115 0.786 0.099 0 0 -0.004 -0.048 1.052 0 0 0 0 0 1 0",greyscale:"0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0 0 0 1 0"};
const base=[3.1,0.9,1.4,0.5,0.7,0.6,0.7,0.4],A=[4.1,1.3,1.1,1.5,1.2,1.3,0.8,0.8],B=[4.3,0.8,1.4,2.1,1.3,1.1,1.5,1.3];
const TH=[.5,.4,.4,.3,.3,.3,.3,.3],P=[1,1,-1,-1,-1,-1,-1,-1];
const x=v=>30+v*55,y=i=>40+i*52;
function svg(name,m){let s=`<svg width="400" height="460" viewBox="0 0 400 460">`;
if(m)s+=`<defs><filter id="cb${name}"><feColorMatrix type="matrix" values="${m}"/></filter></defs><g filter="url(#cb${name})">`;else s+='<g>';
s+=`<rect width="400" height="460" fill="#F5F3F7"/><defs><filter id="f${name}" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
let L=base.map((v,i)=>[x(v-TH[i]),y(i)]),R=base.map((v,i)=>[x(v+TH[i]),y(i)]).reverse();
s+=`<path d="M${L.concat(R).map(p=>p.join(',')).join('L')}Z" fill="#fff" filter="url(#f${name})"/>`;
for(let g=0;g<=6;g++)s+=`<line x1="${x(g)}" x2="${x(g)}" y1="20" y2="440" stroke="#DCD9E0" stroke-width="0.6"/>`;
const line=(d,c,w)=>`<polyline points="${d.map((v,i)=>x(v)+','+y(i)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
s+=line(base,'#2A2634',1.6)+line(A,'#625492',2.2)+line(B,'#61829E',2.2);
[A,B].forEach((S,k)=>S.forEach((v,i)=>{const d=Math.round(v*10)-Math.round(base[i]*10);if(Math.abs(d)>=TH[i]*10){const c=d*P[i]>0?'#74936C':'#B15D59';s+=`<circle cx="${x(v)}" cy="${y(i)}" r="11" fill="${c}" opacity=".35"/><circle cx="${x(v)}" cy="${y(i)}" r="11" fill="none" stroke="${c}" stroke-width="1"/>`}
s+=`<circle cx="${x(v)}" cy="${y(i)}" r="4" fill="${k?'#61829E':'#625492'}"/>`}));
base.forEach((v,i)=>s+=`<circle cx="${x(v)}" cy="${y(i)}" r="3.5" fill="#fff" stroke="#2A2634" stroke-width="1.4"/>`);
return s+'</g></svg>'}
document.getElementById('row').innerHTML=Object.entries(SIMS).map(([n,m])=>`<figure>${svg(n,m)}<figcaption>${n}</figcaption></figure>`).join('');
</script></body></html>
